services:
  - type: web
    name: klinik-kf-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: klinik_kf
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: GATEWAY_URL
        sync: false

  - type: web
    name: klinik-kf-gateway
    runtime: node
    plan: free
    rootDir: whatsapp-gateway
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: BACKEND_URL
        sync: false
      - key: WEBHOOK_TOKEN
        fromService:
          type: web
          name: klinik-kf-backend
          envVarKey: WEBHOOK_TOKEN
